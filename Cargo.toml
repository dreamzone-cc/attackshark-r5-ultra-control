[package]
name = "attackshark-r5-ultra-control"
version = "1.0.0"
edition = "2021"
authors = ["dreamzone-cc"]
description = "Comprehensive Linux Control Center for Attack Shark R5 Ultra Gaming Mouse (Rust + Slint UI)"
license = "MIT"

[dependencies]
slint = "1.17.1"
ksni = { version = "0.3.6", default-features = false, features = ["blocking"] }
libc = "0.2.189"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }

[build-dependencies]
slint-build = "1.17.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
